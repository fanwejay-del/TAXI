<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>計程車記帳</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
button[data-nf],[data-netlify],#netlify,div[class*="netlify"]{display:none!important;}
:root{--fs-num:13;--fw-num:700;}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#f1f5f9;padding:10px 0;font-size:calc(1px * var(--fs-num));color:#1e293b;line-height:1.35;font-weight:var(--fw-num);display:flex;flex-direction:column;overflow:hidden;}
.page{display:none;padding:0 6px;flex:1;min-height:0;flex-direction:column;overflow:hidden;}
.page.active{display:flex;}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:7px;margin-bottom:12px;overflow:hidden;}
.row2 .bigBtn{width:100%;min-width:0;}
.card{background:#fff;border-radius:12px;padding:12px 2px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:4px;}
.global-nav{position:sticky;top:0;z-index:50;background:#fff;border-radius:12px;padding:6px 8px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin:0 6px 8px;display:flex;align-items:center;flex-shrink:0;gap:4px;}
.global-nav .app-brand{display:flex;align-items:center;gap:4px;padding:4px 6px;flex-shrink:0;font-weight:700;color:#1e293b;font-size:calc(1.1px * var(--fs-num));}
.global-nav .nav-wrap{display:flex;justify-content:space-around;align-items:center;flex:1;}
.global-nav .nav-icon{font-size:calc(1.6px * var(--fs-num));padding:6px 10px;border-radius:10px;cursor:pointer;line-height:1;color:#475569;transition:background .15s,transform .1s;}
.global-nav .nav-icon:active{background:#e2e8f0;transform:scale(.95);}
.global-nav .nav-icon.active{background:#dbeafe;color:#2563eb;}
.bigBtn,.numBtn,.payBtn,.navBtn,.editBtn,.delBtn,.sortBtn,.add-btn,.backup-btn,.stat-btn,.setBlock button{box-shadow:0 2px 6px rgba(0,0,0,.14);transition:filter .12s,box-shadow .12s,transform .1s,background .12s;}
.bigBtn:active,.numBtn:active,.payBtn:active,.navBtn:active,.editBtn:active,.delBtn:active,.sortBtn:active,.add-btn:active,.backup-btn:active,.stat-btn:active,.setBlock button:active{filter:brightness(.88);box-shadow:0 1px 3px rgba(0,0,0,.18);transform:scale(.97);}
.bigBtn{padding:0 3px;border:none;border-radius:10px;font-size:clamp(16px,calc(0.85px * var(--fs-num)),18px);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;height:calc(2.6px * var(--fs-num) + 12px);display:flex;align-items:center;justify-content:center;line-height:1;}
.inputBox{width:100%;padding:16px;font-size:28px;text-align:center;border:2px solid #e2e8f0;border-radius:12px;margin:14px 0;background:#f8fafc;color:#0f172a;}
.numKey{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(5px,2vw,10px);width:100%;min-width:0;flex:0 0 auto;}
.numBtn{width:100%;min-width:0;padding:clamp(10px,3.8vw,18px) 4px;font-size:clamp(17px,5.5vw,22px);border-radius:12px;border:none;background:#fff;color:#1e293b;overflow:hidden;}
.numBtn:active{background:#e2e8f0;}
.payKey{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(6px,2.5vw,12px);margin-top:8px;width:100%;min-width:0;overflow:hidden;}
.payBtn{width:100%;min-width:0;padding:clamp(12px,4vw,20px) 6px;border:none;border-radius:12px;color:#fff;font-size:clamp(12px,calc(1.2px * var(--fs-num)),16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.noteInput{width:100%;padding:10px 12px;margin-top:10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:calc(1.05px * var(--fs-num));background:#f8fafc;}
.noteInput:focus{outline:none;border-color:#2563eb;background:#fff;}
.delBtn{color:#dc2626;border:none;background:#fef2f2;font-size:calc(.85px * var(--fs-num));padding:4px 8px;border-radius:6px;}
.setBlock{margin:8px 0;padding:10px 12px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.setBlock h4{margin-bottom:6px;font-size:calc(1.05px * var(--fs-num));color:#0f172a;}
.setBlock input[type="number"],.setBlock input[type="text"]{width:100%;padding:8px 10px;margin:3px 0 6px;border-radius:8px;border:1.5px solid #e2e8f0;font-size:calc(1.05px * var(--fs-num));background:#f8fafc;}
.setBlock button{padding:8px 12px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:calc(1.05px * var(--fs-num));margin-top:6px;}
.hour-preview{margin-top:6px;padding:8px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;font-size:calc(.95px * var(--fs-num));color:#0c4a6e;line-height:1.4;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;background:#fff;display:none;align-items:stretch;justify-content:center;padding:6px;z-index:100;overflow:hidden;}
.modal.active{display:flex;}
.modal-card{width:100%;height:100%;padding:6px;display:flex;flex-direction:column;overflow:hidden;background:#fff;}
.modal-card .input-area {
  flex: 0 1 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 0;
  min-width: 0;
  width: 100%;
  overflow: hidden;
  transform: none !important;
}
#inputModal .numKey, #expInputModal .numKey { flex: 0 0 auto; }
#inputModal .payKey, #expInputModal .payKey { flex: 0 0 auto; min-height: 0; margin-top: 6px; }
.backup-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
.backup-btn{padding:8px 10px;border:none;border-radius:8px;color:#fff;font-size:calc(1.05px * var(--fs-num));}
.exportBtn{background:#16a34a;}
.importBtn{background:#7c3aed;}
.empty-tip{text-align:center;color:#94a3b8;padding:24px 16px;font-size:calc(1.05px * var(--fs-num));}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;gap:8px;flex-shrink:0;}
.section-title h3{font-size:calc(1.15px * var(--fs-num));color:#0f172a;flex-shrink:0;}
.section-title .today-date{font-size:calc(.95px * var(--fs-num));color:#64748b;margin-left:auto;white-space:nowrap;flex-shrink:0;}
.sortBtn{border:none;background:#e0f2fe;color:#0369a1;font-size:calc(.9px * var(--fs-num));padding:5px 10px;border-radius:20px;flex-shrink:0;}
#typeListSet input,#payListSet input,#expListSet input,.setBlock .item input{font-size:calc(.95px * var(--fs-num));padding:4px 8px;height:26px;border-radius:6px;border:1.2px solid #e2e8f0;background:#f8fafc;margin:0;}
#typeListSet input[type="number"],#payListSet input[type="number"],#expListSet input[type="number"],.setBlock .item input[type="number"]{width:4.5em;max-width:72px;text-align:center;flex-shrink:0;}
#typeListSet input:not([type="number"]),#payListSet input:not([type="number"]),#expListSet input:not([type="number"]),.setBlock .item input:not([type="number"]){flex:1;min-width:0;}
.item{background:#fff;padding:2px;margin:2px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.05);gap:8px;}
.color-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.15);cursor:pointer;position:relative;transition:transform .1s;}
.color-dot:active{transform:scale(.88);}
.color-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px dashed transparent;}
.color-dot:hover::after{border-color:#94a3b8;}
/* 首頁：只捲動下方列表 */
.pageHome-top{flex-shrink:0;}
.home-detail-box{background:#fff;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.06);overflow:hidden;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.home-detail-row{display:grid;grid-template-columns:36px 48px 48px 1fr 1fr 1fr 1fr;gap:4px;align-items:center;padding:4px 4px;border-top:1px solid #f1f5f9;font-size:calc(.84px * var(--fs-num));cursor:pointer;}
.home-detail-row:active{background:#eff6ff;}
.home-detail-row>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.home-detail-head{font-weight:800;background:#f8fafc;color:#64748b;padding:6px 4px;position:sticky;top:0;z-index:2;}
.home-detail-head .amount{text-align:right;}
.home-detail-idx{text-align:center;color:#94a3b8;font-variant-numeric:tabular-nums;}
.home-detail-amt{text-align:right;color:#2563eb;font-variant-numeric:tabular-nums;}
.home-detail-fee{text-align:right;color:#dc2626;font-variant-numeric:tabular-nums;}
.home-detail-net{text-align:right;color:#059669;font-variant-numeric:tabular-nums;}
/* 年 / 月 / 日列表：第一欄固定 72px，後三欄平均分配；表頭與數字上下對齊 */
.stat-list-head,.stat-list-row{display:grid;grid-template-columns:72px 1fr 1fr 1fr;gap:8px;align-items:center;}
.stat-list-head{background:#f8fafc;padding:8px 8px;color:#475569;font-size:calc(.86px * var(--fs-num));font-weight:800;position:sticky;top:0;z-index:2;}
.stat-list-head>div{text-align:right;}
.stat-list-head>div:first-child{text-align:left;}
.stat-list-head .head-amount{text-align:right;}
.stat-list-row{padding:9px 8px;border-top:1px solid #f1f5f9;font-size:calc(.96px * var(--fs-num));min-width:0;cursor:pointer;}
.stat-list-row:active{background:#eff6ff;}
.stat-list-row .item-name{color:#2563eb;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;}
.stat-list-row .item-main{color:#2563eb;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.stat-list-row .item-fee{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dc2626;}
.stat-list-row .item-net{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#059669;}
/* 單筆明細（營業）：與首頁明細同款式 */
.stat-detail-row{display:grid;grid-template-columns:48px 48px 1fr 1fr 1fr 1fr;gap:4px;align-items:center;padding:4px 4px;border-top:1px solid #f1f5f9;font-size:calc(.84px * var(--fs-num));cursor:pointer;}
.stat-detail-row:active{background:#eff6ff;}
.stat-detail-row>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-detail-head{font-weight:800;background:#f8fafc;color:#64748b;padding:6px 4px;position:sticky;top:0;z-index:2;}
.stat-detail-head .amount{text-align:right;}
.stat-detail-amt{text-align:right;color:#2563eb;font-variant-numeric:tabular-nums;}
.stat-detail-fee{text-align:right;color:#dc2626;font-variant-numeric:tabular-nums;}
.stat-detail-net{text-align:right;color:#059669;font-variant-numeric:tabular-nums;}
/* 單筆明細（支出） */
.stat-detail-row-exp{display:grid;grid-template-columns:48px 48px 1fr 1fr;gap:4px;align-items:center;padding:4px 4px;border-top:1px solid #f1f5f9;font-size:calc(.84px * var(--fs-num));cursor:pointer;}
.stat-detail-row-exp:active{background:#eff6ff;}
.stat-detail-row-exp>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-detail-row-exp.stat-detail-head{font-weight:800;background:#f8fafc;color:#64748b;padding:6px 4px;position:sticky;top:0;z-index:2;}
.stat-detail-row-exp.stat-detail-head .amount{text-align:right;}
/* 統計卡片與按鈕（避免被原生樣式蓋掉） */
.stat-type-card{
  background:#fff !important;
  border-radius:12px !important;
  padding:10px !important;
  box-shadow:0 2px 8px rgba(0,0,0,.06) !important;
  margin-bottom:12px !important;
  display:grid !important;
  grid-template-columns:repeat(auto-fit, minmax(52px, 1fr)) !important;
  gap:6px !important;
  flex-shrink:0;
}
.stat-type-btn{
  width:100% !important;
  min-width:0 !important;
  padding:9px 4px !important;
  border:none !important;
  border-radius:9px !important;
  background:#e2e8f0 !important;
  color:#475569 !important;
  font-size:clamp(10px, calc(.95px * var(--fs-num)), 15px) !important;
  font-weight:inherit !important;
  cursor:pointer !important;
  white-space:nowrap !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
  transition:filter .12s,transform .1s,box-shadow .12s !important;
  box-shadow:0 1px 3px rgba(0,0,0,.12) !important;
  font-family:inherit !important;
}
.stat-type-btn:active{filter:brightness(.88) !important;transform:scale(.96) !important;}
.stat-type-btn.active{color:#fff !important;box-shadow:0 2px 8px rgba(0,0,0,.25) !important;}
.stat-type-btn.all-btn.active{background:#0f172a !important;}
/* 統計頁面其他 */
.stat-breadcrumb{position:sticky;top:0;z-index:20;background:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.08);margin-bottom:8px;font-size:calc(.95px * var(--fs-num));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.stat-breadcrumb button{border:0;background:none;color:#2563eb;font:inherit;font-weight:700;padding:0 3px;cursor:pointer;}
.stat-breadcrumb .stat-current{color:#475569;font-weight:500;}
.stat-muted{color:#94a3b8;}
.stat-summary-box{background:#fff;border-radius:10px;padding:10px 8px;margin-bottom:8px;box-shadow:0 1px 5px rgba(0,0,0,.06);flex-shrink:0;}
.stat-summary-title{font-size:calc(1.05px * var(--fs-num));font-weight:800;color:#0f172a;margin-bottom:8px;}
/* 合計區塊 */
.stat-summary-grid{
  display:flex;
  flex-wrap:wrap;
  gap:6px 14px;
  align-items:baseline;
}
.stat-summary-grid>div{
  display:inline-flex;
  align-items:baseline;
  gap:4px;
  min-width:0;
  flex:0 1 auto;
  white-space:nowrap;
}
.stat-summary-grid>div.row-main{
  flex:1 1 100%;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px dashed #e2e8f0;
  padding-bottom:6px;
  margin-bottom:2px;
}
.stat-summary-grid>div.row-main .pair{
  display:inline-flex;
  align-items:baseline;
  gap:4px;
  min-width:0;
  flex:0 1 auto;
  white-space:nowrap;
}
.stat-summary-grid>div.row-sub{
  flex:1 1 100%;
  display:flex;
  flex-wrap:nowrap;
  gap:6px 10px;
  justify-content:space-between;
  align-items:baseline;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.stat-summary-grid>div.row-sub .pair{
  display:inline-flex;
  align-items:baseline;
  gap:4px;
  min-width:0;
  flex:0 0 auto;
  white-space:nowrap;
}
.stat-summary-grid>div.row-cost{
  flex:1 1 100%;
  display:inline-flex;
  align-items:baseline;
  gap:4px;
}
.stat-summary-grid span{
  color:#64748b;
  font-size:calc(.82px * var(--fs-num));
  white-space:nowrap;
  flex-shrink:0;
}
.stat-summary-grid strong{
  color:#2563eb;
  font-size:calc(1.12px * var(--fs-num));
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  flex-shrink:1;
  min-width:0;
}
.stat-summary-grid strong.fee{color:#dc2626;}
.stat-summary-grid strong.net{color:#059669;}
.stat-summary-grid strong.cost{color:#ea580c;}
/* 統計頁：只捲動列表 */
.stat-list-box{background:#fff;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.06);overflow:hidden;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
/* 設定頁：可捲動 */
#pageSetting{overflow-y:auto;}
/* 支出統計頁 */
#pageExpStat{overflow:hidden;}
#expContent{overflow-y:auto;-webkit-overflow-scrolling:touch;}
/* 隱藏顏色選擇器 */
.hidden-color{display:none !important;position:absolute !important;width:1px !important;height:1px !important;opacity:0 !important;pointer-events:none !important;}
/* 支出統計專用 */
.exp-summary-card{background:#fff;border-radius:10px;padding:10px 8px;margin-bottom:8px;box-shadow:0 1px 5px rgba(0,0,0,.06);flex-shrink:0;}
.exp-summary-card .stat-summary-title{font-size:calc(1.05px * var(--fs-num));font-weight:800;color:#0f172a;margin-bottom:8px;}
.exp-summary-card .stat-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
.exp-summary-card .stat-summary-grid>div{display:block;}
.exp-summary-card .stat-summary-grid span{display:block;color:#64748b;font-size:calc(.82px * var(--fs-num));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exp-summary-card .stat-summary-grid strong{display:block;text-align:right;color:#dc2626;font-size:calc(1.12px * var(--fs-num));font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exp-summary-card .stat-summary-grid strong.net{color:#059669;}
/* 支出類型 checkbox */
.exp-cost-check{width:16px;height:16px;flex-shrink:0;cursor:pointer;accent-color:#ea580c;margin:0;}
@media(max-width:400px){
  .stat-list-head,.stat-list-row{grid-template-columns:60px 1fr 1fr 1fr;gap:5px;padding-left:5px;padding-right:5px}
  .stat-detail-row{grid-template-columns:40px 40px 1fr 1fr 1fr 1fr;gap:3px;padding-left:3px;padding-right:3px;}
  .stat-detail-row-exp{grid-template-columns:40px 40px 1fr 1fr;gap:3px;padding-left:3px;padding-right:3px;}
  .home-detail-row{grid-template-columns:30px 40px 40px 1fr 1fr 1fr 1fr;gap:3px;padding-left:3px;padding-right:3px;}
}
@media(max-width:600px){body{padding:8px 0;}.page{padding:0 4px;}}
@media(max-width:400px){
  .stat-type-btn{font-size:clamp(9px, calc(.82px * var(--fs-num)), 13px) !important;padding:8px 4px !important;}
  .global-nav .app-brand{font-size:calc(0.95px * var(--fs-num));}
}
</style>
</head>
<body>
<input type="file" id="fileImport" style="display:none" accept=".json">
<input type="color" id="colorPicker" class="hidden-color">
<div class="global-nav">
  <div class="app-brand">🚕 計程車記帳</div>
  <div class="nav-wrap">
    <span class="nav-icon" data-page="pageHome" onclick="showPage('pageHome')">🏠</span>
    <span class="nav-icon" data-page="pageStat" onclick="showPage('pageStat')">📊</span>
    <span class="nav-icon" data-page="pageExpStat" onclick="showPage('pageExpStat')">💸</span>
    <span class="nav-icon" data-page="pageSetting" onclick="showPage('pageSetting')">⚙️</span>
  </div>
</div>
<!-- 收入輸入 Modal -->
<div id="inputModal" class="modal"><div class="modal-card">
<h3 id="modalTitle" style="text-align:center;margin-bottom:8px;font-size:22px;">路招</h3>
<div id="amountShow" class="inputBox">0</div>
<div class="input-area">
  <div class="numKey">
  <button class="numBtn" onclick="pressNum('1')">1</button><button class="numBtn" onclick="pressNum('2')">2</button><button class="numBtn" onclick="pressNum('3')">3</button>
  <button class="numBtn" onclick="pressNum('4')">4</button><button class="numBtn" onclick="pressNum('5')">5</button><button class="numBtn" onclick="pressNum('6')">6</button>
  <button class="numBtn" onclick="pressNum('7')">7</button><button class="numBtn" onclick="pressNum('8')">8</button><button class="numBtn" onclick="pressNum('9')">9</button>
  <button class="numBtn" onclick="clearNum()">清除</button><button class="numBtn" onclick="pressNum('0')">0</button><button class="numBtn" onclick="pressNum('00')">00</button>
  </div>
  <div id="payBtnWrap" class="payKey"></div>
</div>
<button style="width:100%;padding:14px;background:#94a3b8;color:#fff;border:none;border-radius:12px;font-size:17px;flex-shrink:0;" onclick="closeInputModal()">取消</button>
</div></div>
<!-- 支出輸入 Modal -->
<div id="expInputModal" class="modal"><div class="modal-card">
<h3 id="expModalTitle" style="text-align:center;margin-bottom:8px;font-size:22px;">支出</h3>
<div id="expAmountShow" class="inputBox">0</div>
<div class="input-area">
  <div class="numKey">
  <button class="numBtn" onclick="pressExpNum('1')">1</button><button class="numBtn" onclick="pressExpNum('2')">2</button><button class="numBtn" onclick="pressExpNum('3')">3</button>
  <button class="numBtn" onclick="pressExpNum('4')">4</button><button class="numBtn" onclick="pressExpNum('5')">5</button><button class="numBtn" onclick="pressExpNum('6')">6</button>
  <button class="numBtn" onclick="pressExpNum('7')">7</button><button class="numBtn" onclick="pressExpNum('8')">8</button><button class="numBtn" onclick="pressExpNum('9')">9</button>
  <button class="numBtn" onclick="clearExpNum()">清除</button><button class="numBtn" onclick="pressExpNum('0')">0</button><button class="numBtn" onclick="pressExpNum('00')">00</button>
  </div>
  <div id="expCatWrap" class="payKey"></div>
</div>
<input id="expNoteInput" class="noteInput" placeholder="備註（選填）" style="flex-shrink:0;">
