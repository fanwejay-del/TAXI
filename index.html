<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>計程車記帳</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
button[data-nf],[data-netlify],#netlify,div[class*="netlify"]{display:none!important;}
:root{--fs-num:13;--fw-num:700;}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#f1f5f9;padding:10px 0;font-size:calc(1px * var(--fs-num));color:#1e293b;line-height:1.35;font-weight:var(--fw-num);}
.page{display:none;padding:0 6px;}
.page.active{display:block;}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:12px;}
.card{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:4px;}

/* ===== 全局導航列 ===== */
.global-nav{position:sticky;top:0;z-index:50;background:#fff;border-radius:12px;padding:6px 8px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin:0 6px 8px;display:flex;justify-content:space-around;align-items:center;}
.global-nav .nav-icon{font-size:calc(1.6px * var(--fs-num));padding:6px 10px;border-radius:10px;cursor:pointer;line-height:1;color:#475569;transition:background .15s,transform .1s;}
.global-nav .nav-icon:active{background:#e2e8f0;transform:scale(.95);}
.global-nav .nav-icon.active{background:#dbeafe;color:#2563eb;}
.topbar{background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:8px;}
.topbar-inner{display:flex;justify-content:space-between;align-items:center;}
.topbar-title{font-size:calc(1.25px * var(--fs-num));color:#0f172a;line-height:1;}
.topbar-icons{display:flex;gap:6px;align-items:center;}
.stat-icon,.set-icon,.exp-icon{font-size:calc(1.4px * var(--fs-num));color:#475569;padding:4px 6px;cursor:pointer;border-radius:8px;line-height:1;}
.stat-icon:active,.set-icon:active,.exp-icon:active{background:#e2e8f0;}

.bigBtn,.numBtn,.payBtn,.navBtn,.editBtn,.delBtn,.sortBtn,.add-btn,.backup-btn,.stat-btn,.setBlock button{box-shadow:0 2px 6px rgba(0,0,0,.14);transition:filter .12s,box-shadow .12s,transform .1s,background .12s;}
.bigBtn:active,.numBtn:active,.payBtn:active,.navBtn:active,.editBtn:active,.delBtn:active,.sortBtn:active,.add-btn:active,.backup-btn:active,.stat-btn:active,.setBlock button:active{filter:brightness(.88);box-shadow:0 1px 3px rgba(0,0,0,.18);transform:scale(.97);}
.bigBtn{padding:12px 6px;border:none;border-radius:12px;font-size:calc(1.05px * var(--fs-num));color:#fff;}
.inputBox{width:100%;padding:16px;font-size:28px;text-align:center;border:2px solid #e2e8f0;border-radius:12px;margin:14px 0;background:#f8fafc;color:#0f172a;}
.numKey{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.numBtn{padding:18px 8px;font-size:22px;border-radius:12px;border:none;background:#fff;color:#1e293b;}
.numBtn:active{background:#e2e8f0;}
.payKey{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.payBtn{padding:20px 10px;border:none;border-radius:12px;color:#fff;font-size:calc(1.2px * var(--fs-num));}
.noteInput{width:100%;padding:10px 12px;margin-top:10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:calc(1.05px * var(--fs-num));background:#f8fafc;}
.noteInput:focus{outline:none;border-color:#2563eb;background:#fff;}
.editBtn{color:#2563eb;border:none;background:#eff6ff;font-size:calc(.9px * var(--fs-num));padding:6px 8px;border-radius:8px;flex-shrink:0;}
.delBtn{color:#dc2626;border:none;background:#fef2f2;font-size:calc(.85px * var(--fs-num));padding:4px 8px;border-radius:6px;}
.backHomeBar{display:none;}
.navBtn{flex:1;padding:12px;border:none;border-radius:10px;background:#e2e8f0;font-size:calc(1.05px * var(--fs-num));color:#334155;}
.setBlock{margin:8px 0;padding:10px 12px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.setBlock h4{margin-bottom:6px;font-size:calc(1.05px * var(--fs-num));color:#0f172a;}
.setBlock input[type="number"],.setBlock input[type="text"]{width:100%;padding:8px 10px;margin:3px 0 6px;border-radius:8px;border:1.5px solid #e2e8f0;font-size:calc(1.05px * var(--fs-num));background:#f8fafc;}
.setBlock button{padding:8px 12px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:calc(1.05px * var(--fs-num));margin-top:6px;}
.hour-preview{margin-top:6px;padding:8px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;font-size:calc(.95px * var(--fs-num));color:#0c4a6e;line-height:1.4;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;background:#fff;display:none;align-items:stretch;justify-content:center;padding:6px;z-index:100;overflow:hidden;}
.modal.active{display:flex;}
.modal-card{width:100%;height:100%;padding:6px;display:flex;flex-direction:column;overflow:hidden;background:#fff;}
.backup-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
.backup-btn{padding:8px 10px;border:none;border-radius:8px;color:#fff;font-size:calc(1.05px * var(--fs-num));}
.exportBtn{background:#16a34a;}
.importBtn{background:#7c3aed;}
.empty-tip{text-align:center;color:#94a3b8;padding:24px 16px;font-size:calc(1.05px * var(--fs-num));}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;gap:8px;}
.section-title h3{font-size:calc(1.15px * var(--fs-num));color:#0f172a;flex-shrink:0;}
.section-title .today-date{font-size:calc(.95px * var(--fs-num));color:#64748b;margin-left:auto;white-space:nowrap;flex-shrink:0;}
.sortBtn{border:none;background:#e0f2fe;color:#0369a1;font-size:calc(.9px * var(--fs-num));padding:5px 10px;border-radius:20px;flex-shrink:0;}
#typeListSet input,#payListSet input,#expListSet input,.setBlock .item input{font-size:calc(.95px * var(--fs-num));padding:4px 8px;height:26px;border-radius:6px;border:1.2px solid #e2e8f0;background:#f8fafc;margin:0;}
#typeListSet input[type="number"],#payListSet input[type="number"],#expListSet input[type="number"],.setBlock .item input[type="number"]{width:4.5em;max-width:72px;text-align:center;flex-shrink:0;}
#typeListSet input:not([type="number"]),#payListSet input:not([type="number"]),#expListSet input:not([type="number"]),.setBlock .item input:not([type="number"]){flex:1;min-width:0;}
.item{background:#fff;padding:2px 8px;margin:2px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.05);gap:8px;}
.item .color-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.detail-row{display:flex;align-items:center;background:#fff;border-radius:10px;margin:3px 0;padding:3px 8px 3px 6px;box-shadow:0 1px 3px rgba(0,0,0,.05);font-size:calc(1.05px * var(--fs-num));font-family:Consolas,Menlo,monospace;white-space:nowrap;line-height:1.1;cursor:pointer;flex-wrap:wrap;gap:2px 4px;}
.detail-row:active{background:#f1f5f9;}
.detail-row>span{flex-shrink:0;white-space:nowrap;}
.dr-left{color:#0f172a;font-size:calc(.9px * var(--fs-num));}
.dr-type{margin-right:6px;}
.dr-amt{text-align:right;margin-right:6px;}
.dr-net{text-align:right;margin-right:6px;}
.dr-cum{text-align:right;margin-left:auto;}
.filter-bar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.filter-card{background:#fff;border-radius:12px;padding:12px 10px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-width:0;overflow:hidden;}
.filter-card:active{background:#f8fafc;transform:scale(.99);}
.filter-card .fc-main{font-size:calc(1.55px * var(--fs-num));color:#0f172a;flex-shrink:0;min-width:0;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.filter-card .fc-stat{font-size:calc(1.1px * var(--fs-num));color:#475569;flex:1;margin-left:8px;line-height:1.5;display:flex;justify-content:flex-end;align-items:baseline;gap:clamp(2px,1.2vw,6px);min-width:0;overflow:hidden;flex-wrap:wrap;}
.filter-card .fc-arrow{color:#94a3b8;font-size:calc(1.25px * var(--fs-num));margin-left:6px;flex-shrink:0;}
.filter-card .fc-stat span,.summary-card .sc-stat span,.stat-card .sc-stat span{flex:0 1 auto;min-width:0;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;}
.filter-card .fc-stat .sum,.summary-card .sc-stat .sum,.stat-card .sc-stat .sum{color:#2563eb;}
.filter-card .fc-stat .cnt,.summary-card .sc-stat .cnt,.stat-card .sc-stat .cnt{color:#94a3b8;}
.filter-card .fc-stat .fee,.summary-card .sc-stat .fee,.stat-card .sc-stat .fee{color:#dc2626;}
.filter-card .fc-stat .net,.summary-card .sc-stat .net,.stat-card .sc-stat .net{color:#7e22ce;}
.filter-card .fc-stat .bal,.summary-card .sc-stat .bal,.stat-card .sc-stat .bal{color:#059669;}
.summary-card{background:#fff;border-radius:10px;padding:10px 12px;margin:5px 0 8px;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:calc(1.05px * var(--fs-num));min-width:0;overflow:hidden;}
.summary-card .sc-name{color:#0f172a;flex-shrink:0;}
.summary-card .sc-stat{flex:1;color:#475569;font-size:calc(.92px * var(--fs-num));display:flex;justify-content:flex-end;align-items:baseline;gap:clamp(2px,1.2vw,6px);min-width:0;overflow:hidden;flex-wrap:wrap;}
.stat-card{background:#fff;border-radius:10px;padding:10px 12px;margin:5px 0;box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:calc(1.05px * var(--fs-num));gap:6px;min-width:0;overflow:hidden;}
.stat-card:active{background:#f8fafc;}
.stat-card .sc-name{color:#2563eb;flex-shrink:0;min-width:52px;}
.stat-card.exp .sc-name{color:#dc2626;}
.stat-card .sc-stat{flex:1;color:#475569;font-size:calc(.92px * var(--fs-num));display:flex;justify-content:flex-end;align-items:baseline;gap:clamp(2px,1.2vw,6px);min-width:0;overflow:hidden;flex-wrap:wrap;}
.crumb{font-size:calc(.95px * var(--fs-num));color:#64748b;margin-bottom:8px;}
.add-bar{margin-bottom:12px;}
.add-btn{width:100%;padding:12px;border:none;border-radius:12px;background:#dc2626;color:#fff;font-size:calc(1.1px * var(--fs-num));}
.exp-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:10px;margin:4px 0;padding:8px 10px;box-shadow:0 1px 4px rgba(0,0,0,.05);font-size:calc(1.05px * var(--fs-num));gap:6px;cursor:pointer;flex-wrap:wrap;}
.exp-row:active{background:#f1f5f9;}
.exp-row>span{white-space:nowrap;flex-shrink:0;}
.exp-row .er-time{color:#64748b;font-size:calc(.9px * var(--fs-num));}
.exp-row .er-note{color:#475569;font-size:calc(.9px * var(--fs-num));flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.exp-row .er-amt{color:#dc2626;text-align:right;margin-left:auto;}
#expInputModal .modal-card{padding:4px 6px;display:flex;flex-direction:column;height:100%;min-height:0;gap:6px;}
#expInputModal #expModalTitle{font-size:calc(1.3px * var(--fs-num))!important;margin:0!important;text-align:center;}
#expInputModal .inputBox{font-size:calc(2px * var(--fs-num));padding:10px;margin:0;}
#expInputModal .numKey{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(4,1fr);gap:6px;margin:0;}
#expInputModal .numBtn{padding:0;font-size:calc(1.3px * var(--fs-num));border-radius:10px;height:100%;min-height:0;}
#expInputModal .payKey{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;max-height:26vh;overflow-y:auto;}
#expInputModal .payBtn{padding:14px 8px;font-size:calc(1.2px * var(--fs-num));border-radius:10px;}
#expInputModal .noteInput{margin:0!important;padding:14px 12px;font-size:calc(1.2px * var(--fs-num));}
#expInputModal>.modal-card>button{margin:0!important;padding:14px!important;font-size:calc(1.15px * var(--fs-num))!important;}
.fs-wrap{display:flex;align-items:center;gap:10px;margin-top:6px;}
.fs-wrap input[type="range"]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:#e2e8f0;outline:none;}
.fs-wrap input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#2563eb;cursor:pointer;}
.fs-value{font-size:calc(1.05px * var(--fs-num));color:#2563eb;min-width:34px;text-align:right;}
#inputModal #modalTitle{font-size:calc(1.3px * var(--fs-num))!important;margin:0 0 2px!important;text-align:center;}
#inputModal .inputBox{font-size:clamp(26px,7vw,32px);padding:8px 10px;margin:4px 0 6px;}
#inputModal .numKey{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(4,1fr);gap:5px;margin:0;}
#inputModal .numBtn{padding:0;margin:0;font-size:clamp(16px,5vw,22px);height:100%;min-height:0;border-radius:8px;}
#inputModal .payKey{flex-shrink:0;margin-top:8px;gap:10px;}
#inputModal .payBtn{padding:18px 8px;font-size:calc(1.2px * var(--fs-num));}
#inputModal>.modal-card>button{margin-top:6px!important;padding:10px!important;font-size:calc(1.1px * var(--fs-num))!important;}

/* ===== 首頁統計卡片 ===== */
.day-summary-card{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:calc(1.05px * var(--fs-num));line-height:1.6;}
.day-summary-card .stat-pair{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap;flex-shrink:0;}
.day-summary-card .stat-pair .lbl{color:#475569;}
.day-summary-card .stat-pair .val{font-variant-numeric:tabular-nums;}
.day-summary-card .stat-pair .val.blue{color:#2563eb;font-size:calc(1.3px * var(--fs-num));}
.day-summary-card .stat-pair .val.purple{color:#7e22ce;}
.day-summary-card .stat-pair .val.red{color:#dc2626;}

/* ★ 新增：統計頁類別篩選卡片 */
.stat-type-card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;}
.stat-type-btn{flex:1 1 0;min-width:56px;max-width:100%;padding:9px 6px;border:none;border-radius:9px;background:#e2e8f0;color:#475569;font-size:calc(.95px * var(--fs-num));font-weight:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:filter .12s,transform .1s,box-shadow .12s;box-shadow:0 1px 3px rgba(0,0,0,.12);}
.stat-type-btn:active{filter:brightness(.88);transform:scale(.96);}
.stat-type-btn.active{color:#fff!important;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.stat-type-btn.all-btn.active{background:#0f172a!important;}

@media(max-width:600px){body{padding:8px 0;}.page{padding:0 4px;}}
@media(max-width:400px){.summary-card .sc-stat,.stat-card .sc-stat{font-size:calc(.82px * var(--fs-num));gap:2px;}.stat-type-btn{font-size:calc(.82px * var(--fs-num));padding:8px 4px;min-width:44px;}}
</style>
</head>
<body>
<input type="file" id="fileImport" style="display:none" accept=".json">

<!-- ===== 全局導航列 ===== -->
<div class="global-nav">
  <span class="nav-icon" data-page="pageHome" onclick="showPage('pageHome')">🏠</span>
  <span class="nav-icon" data-page="pageStat" onclick="showPage('pageStat')">📊</span>
  <span class="nav-icon" data-page="pageExpStat" onclick="showPage('pageExpStat')">💸</span>
  <span class="nav-icon" data-page="pageSetting" onclick="showPage('pageSetting')">⚙️</span>
</div>

<div id="inputModal" class="modal"><div class="modal-card">
<h3 id="modalTitle" style="text-align:center;margin-bottom:8px;font-size:22px;">路招</h3>
<div id="amountShow" class="inputBox">0</div>
<div class="numKey">
<button class="numBtn" onclick="pressNum('1')">1</button><button class="numBtn" onclick="pressNum('2')">2</button><button class="numBtn" onclick="pressNum('3')">3</button>
<button class="numBtn" onclick="pressNum('4')">4</button><button class="numBtn" onclick="pressNum('5')">5</button><button class="numBtn" onclick="pressNum('6')">6</button>
<button class="numBtn" onclick="pressNum('7')">7</button><button class="numBtn" onclick="pressNum('8')">8</button><button class="numBtn" onclick="pressNum('9')">9</button>
<button class="numBtn" onclick="clearNum()">清除</button><button class="numBtn" onclick="pressNum('0')">0</button><button class="numBtn" onclick="pressNum('00')">00</button>
</div>
<div id="payBtnWrap" class="payKey"></div>
<button style="width:100%;margin-top:12px;padding:14px;background:#94a3b8;color:#fff;border:none;border-radius:12px;font-size:17px;" onclick="closeInputModal()">取消</button>
</div></div>

<div id="expInputModal" class="modal"><div class="modal-card">
<h3 id="expModalTitle" style="text-align:center;margin-bottom:8px;font-size:22px;">支出</h3>
<div id="expAmountShow" class="inputBox">0</div>
<div class="numKey">
<button class="numBtn" onclick="pressExpNum('1')">1</button><button class="numBtn" onclick="pressExpNum('2')">2</button><button class="numBtn" onclick="pressExpNum('3')">3</button>
<button class="numBtn" onclick="pressExpNum('4')">4</button><button class="numBtn" onclick="pressExpNum('5')">5</button><button class="numBtn" onclick="pressExpNum('6')">6</button>
<button class="numBtn" onclick="pressExpNum('7')">7</button><button class="numBtn" onclick="pressExpNum('8')">8</button><button class="numBtn" onclick="pressExpNum('9')">9</button>
<button class="numBtn" onclick="clearExpNum()">清除</button><button class="numBtn" onclick="pressExpNum('0')">0</button><button class="numBtn" onclick="pressExpNum('00')">00</button>
</div>
<div id="expCatWrap" class="payKey"></div>
<input id="expNoteInput" class="noteInput" placeholder="備註（選填）">
<button style="width:100%;background:#94a3b8;color:#fff;border:none;border-radius:12px;font-size:16px;" onclick="closeExpInputModal()">取消</button>
</div></div>

<div id="editModal" class="modal"><div class="modal-card">
<h3 style="text-align:center;margin-bottom:16px;font-size:18px;">修改紀錄</h3>
<label style="font-size:13px;color:#64748b;">類別</label>
<select id="editType" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:14px;background:#f8fafc;"></select>
<label style="font-size:13px;color:#64748b;">金額</label>
<input id="editAmount" type="number" class="inputBox" style="font-size:22px;padding:14px;margin:6px 0 12px;">
<label style="font-size:13px;color:#64748b;">付款方式</label>
<select id="editPay" style="width:100%;padding:12px;margin:6px 0 16px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:14px;background:#f8fafc;"></select>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
<button onclick="saveEdit()" style="padding:12px;border:none;border-radius:12px;background:#2563eb;color:#fff;font-size:14px;">儲存</button>
<button onclick="closeEditModal()" style="padding:12px;border:none;border-radius:12px;background:#94a3b8;color:#fff;font-size:14px;">取消</button>
</div>
<button onclick="deleteRec()" style="width:100%;margin-top:12px;padding:12px;border:none;border-radius:12px;background:#dc2626;color:#fff;font-size:14px;">刪除此筆</button>
</div></div>

<div id="editExpModal" class="modal"><div class="modal-card">
<h3 style="text-align:center;margin-bottom:16px;font-size:18px;">修改支出</h3>
<label style="font-size:13px;color:#64748b;">類型</label>
<select id="editExpCat" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:14px;background:#f8fafc;"></select>
<label style="font-size:13px;color:#64748b;">金額</label>
<input id="editExpAmount" type="number" class="inputBox" style="font-size:22px;padding:14px;margin:6px 0 12px;">
<label style="font-size:13px;color:#64748b;">備註</label>
<input id="editExpNote" type="text" style="width:100%;padding:12px;margin:6px 0 16px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:14px;background:#f8fafc;">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
<button onclick="saveEditExp()" style="padding:12px;border:none;border-radius:12px;background:#2563eb;color:#fff;font-size:14px;">儲存</button>
<button onclick="closeEditExpModal()" style="padding:12px;border:none;border-radius:12px;background:#94a3b8;color:#fff;font-size:14px;">取消</button>
</div>
<button onclick="deleteExp()" style="width:100%;margin-top:12px;padding:12px;border:none;border-radius:12px;background:#dc2626;color:#fff;font-size:14px;">刪除此筆</button>
</div></div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}

var currentType="",editId=null,editExpId=null,historyStack=[],modalAmount="",expModalAmount="",sortNewFirst=true,statViewStack=[],expViewStack=[];

/* ★ 新增：統計頁目前選取的營業類別（""=全部） */
var statTypeFilter="";

function nextId(){var seq=Number(localStorage.getItem('taxiSeq')||0)+1;localStorage.setItem('taxiSeq',seq);return Date.now()*1000+(seq%1000);}

var config=JSON.parse(localStorage.getItem('taxiConfig'))||{
  typeList:[{name:"路招",deduct:0,color:"#2563eb"},{name:"派遣",deduct:10,color:"#ea580c"}],
  payList:[{name:"現金",rate:0,color:"#16a34a"},{name:"悠遊卡",rate:3,color:"#22aabb"},{name:"信用卡",rate:3,color:"#7c3aed"},{name:"企業簽單",rate:15,color:"#9333ea"},{name:"好孕券",rate:0,color:"#0891b2"}],
  expList:[{name:"加油",color:"#dc2626"},{name:"維修",color:"#ea580c"},{name:"餐費",color:"#9333ea"},{name:"停車",color:"#0891b2"},{name:"其他",color:"#475569"}],
  businessHour:{start:22,end:8},fontSize:13,fontWeight:700
};
if(!config.businessHour)config.businessHour={start:22,end:8};
if(!config.fontSize)config.fontSize=13;
if(!config.fontWeight)config.fontWeight=700;
if(!config.expList)config.expList=[{name:"加油",color:"#dc2626"},{name:"其他",color:"#475569"}];

/* ===== 營業類別自動配色 ===== */
var TYPE_COLORS=[
  '#2563eb','#ea580c','#16a34a','#7c3aed','#dc2626',
  '#0891b2','#ca8a04','#db2777','#059669','#9333ea',
  '#0d9488','#e11d48','#4f46e5','#65a30d','#c2410c',
  '#0369a1','#a21caf','#b45309','#15803d','#be123c'
];
function pickUnusedColor(){
  var used=config.typeList.map(function(t){return String(t.color||'').toLowerCase();});
  for(var i=0;i<TYPE_COLORS.length;i++){
    if(used.indexOf(TYPE_COLORS[i].toLowerCase())<0)return TYPE_COLORS[i];
  }
  return TYPE_COLORS[config.typeList.length%TYPE_COLORS.length];
}
function pickUnusedColorExcluding(seen){
  for(var i=0;i<TYPE_COLORS.length;i++){
    if(!seen[TYPE_COLORS[i].toLowerCase()])return TYPE_COLORS[i];
  }
  return TYPE_COLORS[Object.keys(seen).length%TYPE_COLORS.length];
}
function ensureTypeColors(){
  var seen={},changed=false;
  config.typeList.forEach(function(t){
    var c=String(t.color||'').toLowerCase();
    if(!c||seen[c]){
      var nc=pickUnusedColorExcluding(seen);
      t.color=nc;seen[nc.toLowerCase()]=1;changed=true;
    }else{seen[c]=1;}
  });
  if(changed)saveConfig();
}

function applyFontSize(v){document.documentElement.style.setProperty('--fs-num',v);}
function applyFontWeight(v){document.documentElement.style.setProperty('--fw-num',v);}
applyFontSize(config.fontSize);applyFontWeight(config.fontWeight);

function onFontSizeChange(v){document.getElementById('fontSizeValue').textContent=v;applyFontSize(Number(v));config.fontSize=Number(v)||13;saveConfig();}
function onFontWeightChange(v){document.getElementById('fontWeightValue').textContent=v;applyFontWeight(Number(v));config.fontWeight=Number(v)||700;saveConfig();}
function onHourChange(){updateHourPreview();var s=Number(document.getElementById('setStartHour').value),e=Number(document.getElementById('setEndHour').value);if(!Number.isInteger(s)||s<0||s>23)return;if(!Number.isInteger(e)||e<0||e>23)return;config.businessHour={start:s,end:e};saveConfig();}
function onTypeNameChange(i,v){if(config.typeList[i]){config.typeList[i].name=v.trim();saveConfig();renderHomeTypeBtn();}}
function onTypeDeductChange(i,v){if(config.typeList[i]){config.typeList[i].deduct=Math.max(0,Number(v)||0);saveConfig();}}
function onPayNameChange(i,v){if(config.payList[i]){config.payList[i].name=v.trim();saveConfig();}}
function onPayRateChange(i,v){if(config.payList[i]){config.payList[i].rate=Math.max(0,Number(v)||0);saveConfig();}}
function onExpNameChange(i,v){if(config.expList[i]){config.expList[i].name=v.trim();saveConfig();}}

function saveConfig(){localStorage.setItem('taxiConfig',JSON.stringify(config));}
function getRecords(){return JSON.parse(localStorage.getItem('taxiRec'))||[];}
function saveRecords(l){localStorage.setItem('taxiRec',JSON.stringify(l));}
function getExpenses(){return JSON.parse(localStorage.getItem('taxiExp'))||[];}
function saveExpenses(l){localStorage.setItem('taxiExp',JSON.stringify(l));}
function fmtTime(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function escapeHtml(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function isCashPay(p){var first=config.payList[0];return !!(first&&first.name===p);}
function getBizDate(dt){var h=dt.getHours(),sh=Number(config.businessHour&&config.businessHour.start!=null?config.businessHour.start:22),eh=Number(config.businessHour&&config.businessHour.end!=null?config.businessHour.end:8);var d=new Date(dt);if(sh>eh&&h<eh)d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function getTodayWeekdayText(){
  var d=new Date();
  var wd=['日','一','二','三','四','五','六'][d.getDay()];
  return (d.getMonth()+1)+'/'+String(d.getDate()).padStart(2,'0')+' 週'+wd;
}
function fmtDayShort(d){return parseInt(d,10)+'日';}
function fmtMonthShort(m){return parseInt(m,10)+'月';}
function fmtYearShort(y){return String(y).slice(-2)+'年';}

function exportBackup(){var data={saveTime:new Date().toISOString(),config:config,records:getRecords(),expenses:getExpenses()};var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='計程車記帳備份_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);alert('✅ 備份檔已下載！');}

function isValidRecord(r){return r&&typeof r==='object'&&typeof r.id!=='undefined'&&typeof r.type==='string'&&typeof r.pay==='string'&&Number.isFinite(Number(r.raw))&&Number.isFinite(Number(r.net))&&typeof r.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date);}
function isValidExpense(e){return e&&typeof e==='object'&&typeof e.id!=='undefined'&&typeof e.cat==='string'&&Number.isFinite(Number(e.raw))&&typeof e.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date);}

document.getElementById('fileImport').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      if(!d.config||!Array.isArray(d.records)||!Array.isArray(d.config.typeList)||!Array.isArray(d.config.payList)){alert('❌ 備份檔格式錯誤');return;}
      if(d.records.find(function(x){return !isValidRecord(x);})){alert('❌ 收入紀錄格式錯誤，已中止匯入');return;}
      if(d.expenses&&!Array.isArray(d.expenses)){alert('❌ 支出紀錄格式錯誤');return;}
      if(d.expenses&&d.expenses.find(function(x){return !isValidExpense(x);})){alert('❌ 支出紀錄格式錯誤，已中止匯入');return;}
      if(!confirm('⚠️ 匯入將覆蓋現在全部記錄與設定，確定繼續？'))return;
      config=d.config;
      if(!config.businessHour)config.businessHour={start:22,end:8};
      if(!config.fontSize)config.fontSize=13;
      if(!config.fontWeight)config.fontWeight=700;
      if(!config.expList)config.expList=[{name:'加油',color:'#dc2626'},{name:'其他',color:'#475569'}];
      if(config.payList)config.payList.forEach(function(p){delete p.isCash;});
      ensureTypeColors();
      saveConfig();saveRecords(d.records);
      saveExpenses(Array.isArray(d.expenses)?d.expenses:[]);
      applyFontSize(config.fontSize);applyFontWeight(config.fontWeight);
      alert('✅ 匯入成功！');
      renderHomeTypeBtn();calcTotal();renderTodayList();refreshStatCards();refreshExpCards();
    }catch(err){alert('❌ 檔案讀取失敗');}
  };
  r.readAsText(f);this.value=null;
};

function renderHomeTypeBtn(){var wrap=document.getElementById('typeBtnWrap');wrap.innerHTML='';config.typeList.forEach(function(t){var btn=document.createElement('button');btn.className='bigBtn';btn.style.background=t.color||'#5577aa';btn.textContent=t.name;btn.onclick=function(){openInputModal(t.name);};wrap.appendChild(btn);});}

function updateNavActive(pageId){
  document.querySelectorAll('.global-nav .nav-icon').forEach(function(el){
    el.classList.toggle('active', el.dataset.page===pageId);
  });
}

function showPage(id){
  var cur=document.querySelector('.page.active');
  if(cur&&cur.id!==id&&id!=='pageHome'){if(historyStack[historyStack.length-1]!==cur.id)historyStack.push(cur.id);}
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  updateNavActive(id);
  if(id==='pageSetting'){
    document.getElementById('setStartHour').value=config.businessHour.start;
    document.getElementById('setEndHour').value=config.businessHour.end;
    document.getElementById('fontSizeSlider').value=config.fontSize;
    document.getElementById('fontSizeValue').textContent=config.fontSize;
    document.getElementById('fontWeightSlider').value=config.fontWeight;
    document.getElementById('fontWeightValue').textContent=config.fontWeight;
    updateHourPreview();renderSetting();
  }
  if(id==='pageStat')showStatDefault();
  if(id==='pageExpStat')showExpDefault();
  if(id==='pageHome'){renderHomeTypeBtn();updateTodayDateText();}
}

function updateTodayDateText(){
  var el=document.getElementById('todayDateText');
  if(el)el.textContent=getTodayWeekdayText();
}

function updateHourPreview(){
  var s=Number(document.getElementById('setStartHour').value),e=Number(document.getElementById('setEndHour').value),b=document.getElementById('hourPreview');
  if(!Number.isInteger(s)||s<0||s>23||!Number.isInteger(e)||e<0||e>23){b.innerHTML='請輸入 0～23';return;}
  if(s===e){b.innerHTML='<strong>全天 24 小時</strong>';return;}
  b.innerHTML='<strong>'+String(s).padStart(2,'0')+':00 ～ '+(s>e?'隔日 ':'')+String(e).padStart(2,'0')+':00</strong>';
}

var modal=document.getElementById('inputModal');
function openInputModal(type){currentType=type;modalAmount='';document.getElementById('modalTitle').textContent=type;document.getElementById('amountShow').textContent='0';renderPayBtn();modal.classList.add('active');}
function closeInputModal(){modal.classList.remove('active');}
function pressNum(n){if(modalAmount==='0')modalAmount='';modalAmount+=n;document.getElementById('amountShow').textContent=modalAmount||'0';}
function clearNum(){modalAmount='';document.getElementById('amountShow').textContent='0';}
function renderPayBtn(){var w=document.getElementById('payBtnWrap');w.innerHTML='';config.payList.forEach(function(p){var b=document.createElement('button');b.className='payBtn';b.style.background=p.color||'#557799';b.textContent=p.name;b.onclick=function(){saveRecord(p);};w.appendChild(b);});}

function saveRecord(payItem){
  var amt=Number(modalAmount);if(!amt||amt<=0){alert('請輸入金額');return;}
  var now=new Date(),typeItem=config.typeList.find(function(t){return t.name===currentType;});
  if(payItem.name==='好孕券'&&amt>250){
    var fee=0,net=amt-fee;if(typeItem)net-=Number(typeItem.deduct||0);if(net<0)net=0;
    var list=getRecords();
    list.unshift({id:nextId(),type:currentType,pay:'好孕券',raw:amt,fee:fee,net:Math.round(net),deduct:typeItem?Number(typeItem.deduct||0):0,date:getBizDate(now),time:fmtTime(),splits:[{pay:'好孕券',amount:250},{pay:(config.payList[0]&&config.payList[0].name)||'現金',amount:amt-250}]});
    saveRecords(list);
  }else{
    var fee2=amt*Number(payItem.rate||0)/100,net2=amt-fee2;if(typeItem)net2-=Number(typeItem.deduct||0);if(net2<0)net2=0;
    var list2=getRecords();
    list2.unshift({id:nextId(),type:currentType,pay:payItem.name,raw:amt,fee:fee2,net:Math.round(net2),deduct:typeItem?Number(typeItem.deduct||0):0,date:getBizDate(now),time:fmtTime()});
    saveRecords(list2);
  }
  closeInputModal();calcTotal();renderTodayList();refreshStatCards();refreshExpCards();
}

var expModal=document.getElementById('expInputModal');
function openExpInputModal(){expModalAmount='';document.getElementById('expAmountShow').textContent='0';document.getElementById('expNoteInput').value='';renderExpCatBtn();expModal.classList.add('active');}
function closeExpInputModal(){expModal.classList.remove('active');}
function pressExpNum(n){if(expModalAmount==='0')expModalAmount='';expModalAmount+=n;document.getElementById('expAmountShow').textContent=expModalAmount||'0';}
function clearExpNum(){expModalAmount='';document.getElementById('expAmountShow').textContent='0';}
function renderExpCatBtn(){var w=document.getElementById('expCatWrap');w.innerHTML='';config.expList.forEach(function(c){var b=document.createElement('button');b.className='payBtn';b.style.background=c.color||'#dc2626';b.textContent=c.name;b.onclick=function(){saveExpense(c);};w.appendChild(b);});}
function saveExpense(cat){
  var amt=Number(expModalAmount);if(!amt||amt<=0){alert('請輸入金額');return;}
  var note=document.getElementById('expNoteInput').value.trim(),now=new Date(),list=getExpenses();
  list.unshift({id:nextId(),cat:cat.name,color:cat.color,raw:amt,note:note,date:getBizDate(now),time:fmtTime()});
  saveExpenses(list);closeExpInputModal();refreshExpCards();renderExpView();
}

function calcDayStats(recs,targetDate){
  var daySum=0,cashSum=0,nonCashSum=0,feeSum=0,deductSum=0,typeCount={};
  config.typeList.forEach(function(t){typeCount[t.name]=0;});
  recs.forEach(function(r){
    if(r.date!==targetDate)return;
    daySum+=Number(r.raw||0);
    feeSum+=Number(r.fee||0);
    typeCount[r.type]=(typeCount[r.type]||0)+1;

    if(Number.isFinite(Number(r.deduct))) deductSum+=Number(r.deduct||0);
    else{
      var ti=config.typeList.find(function(t){return t.name===r.type;});
      if(ti)deductSum+=Number(ti.deduct||0);
    }

    if(r.splits&&Array.isArray(r.splits)){
      r.splits.forEach(function(s){
        if(isCashPay(s.pay))cashSum+=Number(s.amount||0);
        else nonCashSum+=Number(s.amount||0);
      });
    }else{
      if(isCashPay(r.pay))cashSum+=Number(r.raw||0);
      else nonCashSum+=Number(r.raw||0);
    }
  });
  return{daySum:daySum,cashSum:cashSum,nonCashSum:nonCashSum,feeSum:feeSum,deductSum:deductSum};
}
function calcTotal(){
  var today=getBizDate(new Date()),s=calcDayStats(getRecords(),today),typeArr=[];
  for(var k in s.typeCount)typeArr.push(k+':'+s.typeCount[k]);
  document.getElementById('typeCountText').textContent=typeArr.join(' ');
  document.getElementById('dayTotal').textContent=s.daySum;
  document.getElementById('cashTotal').textContent=s.cashSum;
  document.getElementById('nonCashTotal').textContent=s.nonCashSum;

/* ★ 修改：calcIncomeStat 改用过滤后的纪录 */
function calcIncomeStat(prefix){
  var recs=getFilteredRecords().filter(function(r){return r.date.indexOf(prefix)===0;});
  return{sum:recs.reduce(function(s,r){return s+Number(r.raw||0);},0),fee:recs.reduce(function(s,r){return s+Number(r.fee||0);},0),net:recs.reduce(function(s,r){return s+Number(r.net||0);},0),cnt:recs.length};
}
function calcExpStat(prefix){
  var list=getExpenses().filter(function(e){return e.date.indexOf(prefix)===0;});
  var sum=list.reduce(function(s,e){return s+Number(e.raw||0);},0),net=calcIncomeStat(prefix).net||0;
  return{sum:sum,count:list.length,net:net,balance:net-sum};
}

  var catItem=config.expList.find(function(c){return c.name===cat;});
  exps[idx].cat=cat;exps[idx].color=catItem?catItem.color:(exps[idx].color||'#dc2626');exps[idx].raw=raw;exps[idx].note=note;
  saveExpenses(exps);closeEditExpModal();renderExpView();refreshExpCards();
}
function deleteExp(){if(editExpId===null)return;if(!confirm('確定要刪除這筆支出嗎？'))return;saveExpenses(getExpenses().filter(function(e){return e.id!==editExpId;}));closeEditExpModal();renderExpView();refreshExpCards();}

function renderSetting(){
  var tw=document.getElementById('typeListSet');tw.innerHTML='';
  config.typeList.forEach(function(t,i){var d=document.createElement('div');d.className='item';
    d.innerHTML='<span class="color-dot" style="background:'+escapeHtml(t.color||'#5577aa')+'"></span><input value="'+escapeHtml(t.name)+'" oninput="onTypeNameChange('+i+',this.value)" placeholder="類別名稱"><input type="number" value="'+t.deduct+'" oninput="onTypeDeductChange('+i+',this.value)" placeholder="扣除"><button class="delBtn" onclick="delTypeTemp('+i+')">刪除</button>';
    tw.appendChild(d);});
  var pw=document.getElementById('payListSet');pw.innerHTML='';
  config.payList.forEach(function(p,i){var d=document.createElement('div');d.className='item';d.innerHTML='<input value="'+escapeHtml(p.name)+'" oninput="onPayNameChange('+i+',this.value)" placeholder="付款名稱"><input type="number" value="'+p.rate+'" oninput="onPayRateChange('+i+',this.value)" placeholder="趴數"><button class="delBtn" onclick="delPayTemp('+i+')">刪除</button>';pw.appendChild(d);});
  var ew=document.getElementById('expListSet');ew.innerHTML='';
  config.expList.forEach(function(e,i){var d=document.createElement('div');d.className='item';d.innerHTML='<input value="'+escapeHtml(e.name)+'" oninput="onExpNameChange('+i+',this.value)" placeholder="支出名稱"><button class="delBtn" onclick="delExpTemp('+i+')">刪除</button>';ew.appendChild(d);});
}
function addNewTypeTemp(){var n=document.getElementById('newTypeName').value.trim(),d=Number(document.getElementById('newTypeDeduct').value)||0;if(!n){alert('請輸入名稱');return;}config.typeList.push({name:n,deduct:d,color:pickUnusedColor()});saveConfig();renderSetting();renderHomeTypeBtn();document.getElementById('newTypeName').value='';document.getElementById('newTypeDeduct').value='';}
function delTypeTemp(i){config.typeList.splice(i,1);saveConfig();renderSetting();renderHomeTypeBtn();}
function addNewPayTemp(){var n=document.getElementById('newPayName').value.trim(),r=Number(document.getElementById('newPayRate').value)||0;if(!n){alert('請輸入名稱');return;}config.payList.push({name:n,rate:r,color:'#557799'});saveConfig();renderSetting();document.getElementById('newPayName').value='';document.getElementById('newPayRate').value='';}
function delPayTemp(i){config.payList.splice(i,1);saveConfig();renderSetting();}
function addNewExpTemp(){var n=document.getElementById('newExpName').value.trim();if(!n){alert('請輸入名稱');return;}config.expList.push({name:n,color:'#dc2626'});saveConfig();renderSetting();document.getElementById('newExpName').value='';}
function delExpTemp(i){config.expList.splice(i,1);saveConfig();renderSetting();}

/* ★ 修改：onload 加上 renderStatTypeCard() */
window.onload=function(){ensureTypeColors();applyFontSize(config.fontSize);applyFontWeight(config.fontWeight);renderHomeTypeBtn();calcTotal();renderTodayList();refreshStatCards();refreshExpCards();renderStatTypeCard();updateNavActive('pageHome');updateTodayDateText();};
</script>
