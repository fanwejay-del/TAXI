<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>踩地雷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #c0c0c0;
    font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", Tahoma, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .back-home {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 100;
    background: #2563eb;
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .back-home:active { filter: brightness(.9); }

  /* 難度選擇畫面 */
  .difficulty-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    background: #c0c0c0;
    border: 4px solid;
    border-color: #fff #808080 #808080 #fff;
    padding: 30px 24px;
    box-shadow: 2px 2px 0 #000;
    max-width: 340px;
    width: 100%;
  }
  .difficulty-screen h1 {
    font-size: 22px;
    font-weight: 800;
    color: #000;
    margin-bottom: 6px;
  }
  .diff-btn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #fff #808080 #808080 #fff;
    cursor: pointer;
    color: #000;
  }
  .diff-btn:active {
    border-color: #808080 #fff #fff #808080;
  }
  .diff-btn .diff-sub {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: #444;
    margin-top: 2px;
  }

  /* 遊戲畫面 */
  .game-container {
    background: #c0c0c0;
    border: 4px solid;
    border-color: #fff #808080 #808080 #fff;
    padding: 8px;
    box-shadow: 2px 2px 0 #000;
    display: none;
  }
  .game-container.active { display: block; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 6px 10px;
    margin-bottom: 8px;
    gap: 8px;
  }
  .counter {
    background: #000;
    color: #f00;
    font-family: "Courier New", monospace;
    font-size: 28px;
    font-weight: bold;
    padding: 2px 8px;
    letter-spacing: 2px;
    min-width: 60px;
    text-align: center;
  }
  .face-btn {
    width: 40px;
    height: 40px;
    font-size: 24px;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #fff #808080 #808080 #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .face-btn:active {
    border-color: #808080 #fff #fff #808080;
  }
  .menu-btn {
    width: 40px;
    height: 40px;
    font-size: 18px;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #fff #808080 #808080 #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: inherit;
  }
  .menu-btn:active {
    border-color: #808080 #fff #fff #808080;
  }
  .board {
    display: grid;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 3px;
    overflow: auto;
  }
  .cell {
    width: 32px;
    height: 32px;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #fff #808080 #808080 #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 18px;
    font-family: "Courier New", monospace;
    cursor: pointer;
  }
  .cell.revealed {
    border: 1px solid #808080;
    background: #c0c0c0;
  }
