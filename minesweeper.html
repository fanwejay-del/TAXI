<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>踩地雷</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #c0c0c0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .game-container {
    background: #c0c0c0;
    border: 4px solid;
    border-color: #fff #808080 #808080 #fff;
    padding: 8px;
    box-shadow: 2px 2px 0 #000;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 6px 10px;
    margin-bottom: 8px;
  }
  .counter {
    background: #000;
    color: #f00;
    font-family: "Courier New", monospace;
    font-size: 28px;
    font-weight: bold;
    padding: 2px 8px;
    letter-spacing: 2px;
    min-width: 60px;
    text-align: center;
  }
  .face-btn {
    width: 40px;
    height: 40px;
    font-size: 24px;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #fff #808080 #808080 #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .face-btn:active {
    border-color: #808080 #fff #fff #808080;
  }
  .board {
    display: grid;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 3px;
  }
  .cell {
    width: 32px;
    height: 32px;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #fff #808080 #808080 #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 18px;
    font-family: "Courier New", monospace;
    cursor: pointer;
  }
  .cell.revealed {
    border: 1px solid #808080;
    background: #c0c0c0;
  }
  .cell.mine {
    background: #f00;
  }
  .cell.flagged::after {
    content: "🚩";
    font-size: 16px;
  }
  .cell[data-count="1"] { color: #0000ff; }
  .cell[data-count="2"] { color: #008000; }
  .cell[data-count="3"] { color: #ff0000; }
  .cell[data-count="4"] { color: #000080; }
  .cell[data-count="5"] { color: #800000; }
  .cell[data-count="6"] { color: #008080; }
  .cell[data-count="7"] { color: #000; }
  .cell[data-count="8"] { color: #808080; }

  .back-home {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 100;
    background: #2563eb;
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .back-home:active { filter: brightness(.9); }

  @media (max-width: 400px) {
    .cell { width: 26px; height: 26px; font-size: 15px; }
    .counter { font-size: 22px; min-width: 50px; }
    .face-btn { width: 34px; height: 34px; font-size: 20px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-home">← 回首頁</a>

<div class="game-container">
  <div class="header">
    <div class="counter" id="mine-count">010</div>
    <button class="face-btn" id="reset-btn">🙂</button>
    <div class="counter" id="timer">000</div>
  </div>
  <div class="board" id="board"></div>
</div>

<script>
(function () {
  const ROWS = 9;
  const COLS = 9;
  const MINES = 10;

  let grid = [];
  let cells = [];
  let gameOver = false;
  let gameWon = false;
  let firstClick = true;
  let flags = 0;
  let time = 0;
  let timerInterval = null;
  let revealedCount = 0;

  const boardEl = document.getElementById('board');
  const mineCountEl = document.getElementById('mine-count');
  const timerEl = document.getElementById('timer');
  const resetBtn = document.getElementById('reset-btn');

  function init() {
    gameOver = false;
    gameWon = false;
    firstClick = true;
    flags = 0;
    time = 0;
    revealedCount = 0;
    clearInterval(timerInterval);
    timerInterval = null;
    timerEl.textContent = '000';
    mineCountEl.textContent = String(MINES).padStart(3, '0');
    resetBtn.textContent = '🙂';

    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    cells = Array.from({ length: ROWS }, () => Array(COLS).fill(null));

    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.addEventListener('click', () => onLeftClick(r, c));
        cell.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          onRightClick(r, c);
        });
        boardEl.appendChild(cell);
        cells[r][c] = cell;
      }
    }
  }

  function placeMines(safeR, safeC) {
    let placed = 0;
    while (placed < MINES) {
      const r = Math.floor(Math.random() * ROWS);
      const c = Math.floor(Math.random() * COLS);
      if (grid[r][c] === -1) continue;
      if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
      grid[r][c] = -1;
      placed++;
    }
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] === -1) continue;
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === -1) count++;
          }
        }
        grid[r][c] = count;
      }
    }
  }

  function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(() => {
      time++;
      if (time > 999) time = 999;
      timerEl.textContent = String(time).padStart(3, '0');
    }, 1000);
  }

  function onLeftClick(r, c) {
    if (gameOver || gameWon) return;
    if (cells[r][c].classList.contains('flagged')) return;

    if (firstClick) {
      firstClick = false;
      placeMines(r, c);
      startTimer();
    }

    reveal(r, c);
  }

  function reveal(r, c) {
    const cell = cells[r][c];
    if (cell.classList.contains('revealed') || cell.classList.contains('flagged')) return;

    cell.classList.add('revealed');
    revealedCount++;

    if (grid[r][c] === -1) {
      cell.classList.add('mine');
      cell.textContent = '💣';
      endGame(false);
      return;
    }

    const count = grid[r][c];
    if (count > 0) {
      cell.textContent = count;
      cell.dataset.count = count;
    } else {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
            if (!cells[nr][nc].classList.contains('revealed')) {
              reveal(nr, nc);
            }
          }
        }
      }
    }

    if (revealedCount === ROWS * COLS - MINES) {
      endGame(true);
    }
  }

  function onRightClick(r, c) {
    if (gameOver || gameWon) return;
    const cell = cells[r][c];
    if (cell.classList.contains('revealed')) return;

    if (cell.classList.contains('flagged')) {
      cell.classList.remove('flagged');
      flags--;
    } else {
      if (flags >= MINES) return;
      cell.classList.add('flagged');
      flags++;
    }
    mineCountEl.textContent = String(MINES - flags).padStart(3, '0');
  }

  function endGame(won) {
    gameOver = true;
    gameWon = won;
    clearInterval(timerInterval);
    timerInterval = null;

    if (won) {
      resetBtn.textContent = '😎';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === -1 && !cells[r][c].classList.contains('flagged')) {
            cells[r][c].classList.add('flagged');
          }
        }
      }
      mineCountEl.textContent = '000';
    } else {
      resetBtn.textContent = '😵';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === -1) {
            cells[r][c].classList.add('revealed');
            if (!cells[r][c].textContent) cells[r][c].textContent = '💣';
          }
        }
      }
    }
  }

  resetBtn.addEventListener('click', init);

  init();
})();
</script>
</body>
</html>
